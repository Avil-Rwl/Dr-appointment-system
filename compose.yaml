services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    image: doctor-backend:v1
    env_file:
      - ./backend/.env

    ports:
      - "4000:4000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  admin:
    build: ./admin
    ports:
      - "5174:5174"
    depends_on:
      - backend
volumes:
  mongo-data:
